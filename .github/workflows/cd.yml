name: CD

# main → imágenes en GHCR + deploy automático a staging.
# tag v* → deploy a producción con aprobación manual (environment "production" con reviewers).
# Los deploys solo corren cuando la variable de repo STAGING_URL / PRODUCTION_URL existe,
# así el pipeline queda en verde (solo imágenes) mientras no haya servidor.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    name: Build & push (GHCR)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/helpdesk-api
          tags: |
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: true
          sbom: true
      - id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/helpdesk-web
          tags: |
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: runtime
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: true
          sbom: true

  deploy-staging:
    name: Deploy a staging
    if: github.ref == 'refs/heads/main' && vars.STAGING_URL != ''
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Deploy por SSH (docker compose pull → migrate → up)
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          TAG: ${{ needs.images.outputs.tag }}
        run: bash ./infra/deploy/deploy.sh

  deploy-production:
    name: Deploy a producción
    if: startsWith(github.ref, 'refs/tags/v') && vars.PRODUCTION_URL != ''
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production # configurar "Required reviewers" en Settings → Environments
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Deploy por SSH
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          TAG: ${{ needs.images.outputs.tag }}
        run: bash ./infra/deploy/deploy.sh
