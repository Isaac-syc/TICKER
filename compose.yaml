# Stack tipo producción: `docker compose up --build` → http://localhost:8080
# Desarrollo con recarga en caliente: `docker compose -f compose.yaml -f compose.dev.yaml up --build`
name: helpdesk

x-api-image: &api-image
  image: ${REGISTRY:-local}/helpdesk-api:${TAG:-latest}
  env_file: .env

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Leases de pestaña y rate limit son efímeros: sin persistencia.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Job de una sola ejecución: migraciones (Alembic) + seed idempotente.
  migrate:
    <<: *api-image
    build:
      context: ./backend
      target: runtime
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  web:
    image: ${REGISTRY:-local}/helpdesk-web:${TAG:-latest}
    build:
      context: ./frontend
      target: runtime
    restart: unless-stopped

  proxy:
    image: nginx:1.29-alpine
    ports:
      - "${PROXY_PORT:-8080}:80"
    environment:
      CSP_SCRIPT_SRC: "'self' 'unsafe-inline'"
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
